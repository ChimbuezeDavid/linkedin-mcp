[project]
name = "linkedin-mcp"
version = "0.1.0"
description = "Universal LinkedIn MCP Server operating strictly within an authenticated user's account"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.3.0",
    "playwright>=1.49.0",
    "playwright-stealth>=1.0.6",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
]

[project.scripts]
linkedin-mcp = "linkedin_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_mcp"]
